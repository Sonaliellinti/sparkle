# Render Blueprint — deploy with "New +" → "Blueprint" in the Render
# dashboard, pointing at this repo. Creates the backend web service and
# (optionally) a managed Postgres instance.
#
# If you're using Supabase instead of Render's own Postgres, delete the
# `databases:` block below and set DATABASE_URL manually in the service's
# environment variables to your Supabase connection string instead.
services:
  - type: web
    name: jee-diagnosis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jee-diagnosis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_ORIGIN
        sync: false   # set this to your deployed Vercel URL after the first deploy
      - key: GROQ_API_KEY
        sync: false   # optional — leave unset to use mock AI responses
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ENVIRONMENT
        value: production

databases:
  - name: jee-diagnosis-db
    plan: free
